org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
android.enableJetifier=true

# Longer timeouts + IPv4-only DNS resolution: on a flaky connection, Gradle's
# default timeouts are short enough that a single slow/dropped lookup fails
# the whole build. -Djava.net.preferIPv4Stack above also sidesteps a common
# Windows issue where a broken/slow IPv6 route causes intermittent
# "No such host is known" for hosts that resolve fine over IPv4.
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=120000
systemProp.https.connectionTimeout=120000
systemProp.https.socketTimeout=120000
